description: FinOps mapping for Prismatic. Prismatic is a per-instance-priced embedded iPaaS;
  customers should track cost-per-deployed-instance, cost-per-active-customer, and execution
  concurrency utilization. Because Prismatic's pricing is quote-based, unit-cost values must be
  pulled from the customer's own MSA / order form rather than from a public rate card.
principles:
  - name: Visibility
    description: Make per-customer integration cost visible to product, engineering, and finance.
  - name: Allocation
    description: Tag every deployed instance with the consuming customer, integration, environment,
      and revenue-generating product line so cost can be allocated and unit-economics computed.
  - name: Optimization
    description: Continuously review which integrations and flows justify their per-instance and
      execution concurrency cost; sunset unused instances.
  - name: Accountability
    description: Establish budget owners — typically the product manager for the customer-facing
      integration surface — and chargeback / showback flows.
domains:
  - name: Understand Usage and Cost
    capabilities:
      - Data Ingestion
      - Allocation
      - Reporting and Analytics
      - Anomaly Management
  - name: Quantify Business Value
    capabilities:
      - Planning and Estimating
      - Forecasting
      - Budgeting
      - Benchmarking
      - Unit Economics
  - name: Optimize Usage and Cost
    capabilities:
      - Rate Optimization
      - Workload Optimization
      - Licensing and SaaS
  - name: Manage the FinOps Practice
    capabilities:
      - FinOps Practice Operations
      - Invoicing and Chargeback
      - Onboarding Workloads
billingModel:
  pricingCategory: Subscription + Usage
  billingFrequency: Monthly
  billingCurrency: USD
  chargeCategories:
    - Usage
    - Purchase
    - Tax
    - Credit
    - Adjustment
  chargeFrequency: Recurring
  primaryUnit: deployed-instance
focusColumns:
  ServiceName: Prismatic
  ServiceCategory: Embedded iPaaS / Developer Tools
  ProviderName: Prismatic
  PublisherName: Prismatic
  InvoiceIssuerName: Prismatic
  PricingCategory: Subscription + Usage
  PricingUnit: instance
  BillingCurrency: USD
  ChargeCategory: Usage
meters:
  - name: deployed_instances
    description: Count of active deployed integration instances during the billing period.
    unit: instance
    aggregation: average
    dimensions:
      - integration
      - customer
      - environment
      - region
  - name: executions
    description: Count of flow executions across all instances.
    unit: execution
    aggregation: sum
    dimensions:
      - integration
      - customer
      - flow
      - environment
  - name: execution_concurrency_peak
    description: Peak concurrent executions observed during the period — drives plan tier choice.
    unit: concurrent_execution
    aggregation: max
    dimensions:
      - organization
      - region
  - name: api_requests
    description: Calls against the Prismatic Management GraphQL API.
    unit: request
    aggregation: sum
    dimensions:
      - api
      - endpoint
      - tier
      - consumer
apis:
  - name: Prismatics GraphQL API
    baseURL: https://app.prismatic.io/api
    tags:
      - Connectors
      - Embedded SaaS
      - Embedded SaaS Integration
      - Integrations
      - Workflows
    serviceName: Prismatics GraphQL API
    serviceCategory: Management API
unitEconomics:
  - name: Cost Per Deployed Instance
    metric: billed_cost / deployed_instances
    target: TBD
  - name: Cost Per Active Customer
    metric: billed_cost / active_customers
    target: TBD
  - name: Cost Per 1K Executions
    metric: billed_cost / (executions / 1000)
    target: TBD
