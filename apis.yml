name: Prismatic
description: >-
  The integration platform for B2B SaaS teams. Prismatic empowers everyone on your team with integration tools for devs
  and non-devs alike, combining a code-native TypeScript SDK with a low-code designer and an embedded marketplace for
  shipping customer-facing integrations.
