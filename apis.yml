- aid: prismatic:prismatics-graphql-api
  name: Prismatics GraphQL API
  description: >-
    Prismatic provides a GraphQL-based API for you to build, deploy, and support your integrations programmatically.
    While Prismatic recommends that new users use the web app or Prismatic CLI tool (prism) to manage
    Prismatic resources, developer users will likely want to use the API to script integration management,
    embed in CI/CD pipelines, and drive multi-tenant deployments.
  humanURL: https://prismatic.io/docs/api/
