specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: Prismatic
providerId: prismatic
created: '2026-05-04'
modified: '2026-05-22'
tags:
  - Embedded iPaaS
  - Integrations
  - Workflows
  - Pricing
description: Machine-readable representation of Prismatic's commercial offering as published on
  https://prismatic.io/pricing/. Prismatic publishes three tiers (Scale, Enterprise, Custom). All
  three are quote-based — Prismatic does not list per-seat or per-instance dollar amounts on the
  public pricing page; every tier directs prospects to a "Schedule my demo" CTA. Tier features
  below reflect what is publicly enumerated on the pricing page.
publicPricingURL: https://prismatic.io/pricing/
pricingModel: quote-based
plans:
  - id: prismatic-scale
    name: Scale
    type: paid
    description: Entry commercial tier. Covers code-native and low-code building, AI-enabled
      development including MCP server support, embedded marketplace, fully managed authentication,
      and a dedicated account manager. Pricing is volume per-instance and is not published.
    entries:
      - label: Integrations
        description: No limit on number of integrations authored.
        name: integrations
        type: quota
        metric: integrations
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: included
      - label: Customers
        description: No limit on number of customers deployed to.
        name: customers
        type: quota
        metric: customers
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: included
      - label: Per-Instance Price
        description: Charged per deployed instance; rate is volume-based and not publicly listed.
        name: per_instance
        type: metered
        metric: instance
        limit: -1
        timeFrame: month
        unit: 1
        price: quote
      - label: Execution Concurrency
        description: Standard concurrency ceiling for flow executions.
        name: execution_concurrency
        type: rate
        metric: concurrent_executions
        limit: standard
        timeFrame: second
        unit: 1
        price: included
    elements:
      - name: Unlimited Team Members
      - name: Unlimited Customers
      - name: Unlimited Integrations
      - name: Unlimited Connectors / Components
      - name: Multi-Region Hosting
      - name: Code-Native And Low-Code Building Tools
      - name: AI-Enabled Development With MCP Server Support
      - name: Embedded Integration Marketplace
      - name: Fully Managed Authentication
      - name: Dedicated Account Manager
  - id: prismatic-enterprise
    name: Enterprise
    type: enterprise
    description: Mid-market tier. Adds higher execution concurrency, private and GovCloud hosting,
      the embedded workflow builder, on-prem connectivity, team SSO, and custom log retention.
    entries:
      - label: Execution Concurrency
        description: Elevated concurrency ceiling for flow executions.
        name: execution_concurrency
        type: rate
        metric: concurrent_executions
        limit: high
        timeFrame: second
        unit: 1
        price: included
      - label: Per-Instance Price
        description: Volume per-instance pricing, negotiated.
        name: per_instance
        type: metered
        metric: instance
        limit: -1
        timeFrame: month
        unit: 1
        price: quote
    elements:
      - name: Everything In Scale
      - name: High Execution Concurrency Limits
      - name: Private And GovCloud Hosting
      - name: Embedded Workflow Builder
      - name: On-Prem Connectivity
      - name: Team Member SSO
      - name: Custom Log Retention
  - id: prismatic-custom
    name: Custom
    type: enterprise
    description: Custom-negotiated tier covering bespoke execution concurrency, instance pricing,
      SLAs, and legal/compliance review.
    entries:
      - label: Execution Concurrency
        description: Custom concurrency negotiated per contract.
        name: execution_concurrency
        type: rate
        metric: concurrent_executions
        limit: custom
        timeFrame: second
        unit: 1
        price: quote
      - label: Per-Instance Price
        description: Custom pricing per instance.
        name: per_instance
        type: metered
        metric: instance
        limit: -1
        timeFrame: month
        unit: 1
        price: custom
    elements:
      - name: Everything In Enterprise
      - name: Custom Execution Concurrency Limits
      - name: Custom Instance Pricing
      - name: Custom SLAs
      - name: Custom Legal And Compliance Review
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
