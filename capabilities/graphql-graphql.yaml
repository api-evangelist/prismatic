naftiko: 1.0.0-alpha2
info:
  label: Prismatic GraphQL API — GraphQL
  description: 'Prismatic GraphQL API — GraphQL. 1 operations. Lead operation: Prismatic Execute GraphQL Query or Mutation.
    Self-contained Naftiko capability covering one Prismatic business surface.'
  tags:
  - Prismatic
  - GraphQL
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    PRISMATIC_API_KEY: PRISMATIC_API_KEY
capability:
  consumes:
  - type: http
    namespace: graphql-graphql
    baseUri: https://app.prismatic.io
    description: Prismatic GraphQL API — GraphQL business capability. Self-contained, no shared references.
    resources:
    - name: api
      path: /api
      operations:
      - name: executegraphqlquery
        method: POST
        description: Prismatic Execute GraphQL Query or Mutation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.PRISMATIC_API_KEY}}'
  exposes:
  - type: rest
    namespace: graphql-graphql-rest
    port: 8080
    description: REST adapter for Prismatic GraphQL API — GraphQL. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/api
      name: api
      description: REST surface for api.
      operations:
      - method: POST
        name: executegraphqlquery
        description: Prismatic Execute GraphQL Query or Mutation
        call: graphql-graphql.executegraphqlquery
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: graphql-graphql-mcp
    port: 9090
    transport: http
    description: MCP adapter for Prismatic GraphQL API — GraphQL. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: prismatic-execute-graphql-query-mutation
      description: Prismatic Execute GraphQL Query or Mutation
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: graphql-graphql.executegraphqlquery
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
