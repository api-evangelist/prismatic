naftiko: 1.0.0-alpha2
info:
  label: Prismatic GraphQL API
  description: Prismatic provides a GraphQL-based API for building, deploying, and supporting integrations programmatically.
    The API allows you to manage customers, integrations, instances, components, and other resources. GraphQL operations include
    queries (pulling data) and mutations (creating, modifying, or deleting data). The API endpoint accepts GraphQL queries
    via HTTP POST requests. Authentication is handled via JWT bearer tokens obtained through the Prismatic web app or CLI
    tool.
  tags:
  - Prismatic
  - API
  created: '2026-05-06'
  modified: '2026-05-06'
capability:
  consumes:
  - type: http
    namespace: prismatic
    baseUri: https://app.prismatic.io
    description: Prismatic GraphQL API HTTP API.
    authentication:
      type: bearer
      token: '{{PRISMATIC_TOKEN}}'
    resources:
    - name: api
      path: /api
      operations:
      - name: executegraphqlquery
        method: POST
        description: Prismatic Execute GraphQL Query or Mutation
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: auth-refresh
      path: /auth/refresh
      operations:
      - name: refreshauthtoken
        method: POST
        description: Prismatic Refresh Authentication Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: auth-revoke
      path: /auth/revoke
      operations:
      - name: revokeauthtoken
        method: POST
        description: Prismatic Revoke Refresh Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: get-auth-token
      path: /get_auth_token/
      operations:
      - name: getauthtoken
        method: GET
        description: Prismatic Get Short-Lived Auth Token
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
  exposes:
  - type: rest
    port: 8080
    namespace: prismatic-rest
    description: REST adapter for Prismatic GraphQL API.
    resources:
    - path: /api
      name: executegraphqlquery
      operations:
      - method: POST
        name: executegraphqlquery
        description: Prismatic Execute GraphQL Query or Mutation
        call: prismatic.executegraphqlquery
        outputParameters:
        - type: object
          mapping: $.
    - path: /auth/refresh
      name: refreshauthtoken
      operations:
      - method: POST
        name: refreshauthtoken
        description: Prismatic Refresh Authentication Token
        call: prismatic.refreshauthtoken
        outputParameters:
        - type: object
          mapping: $.
    - path: /auth/revoke
      name: revokeauthtoken
      operations:
      - method: POST
        name: revokeauthtoken
        description: Prismatic Revoke Refresh Token
        call: prismatic.revokeauthtoken
        outputParameters:
        - type: object
          mapping: $.
    - path: /get_auth_token/
      name: getauthtoken
      operations:
      - method: GET
        name: getauthtoken
        description: Prismatic Get Short-Lived Auth Token
        call: prismatic.getauthtoken
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    port: 9090
    namespace: prismatic-mcp
    transport: http
    description: MCP adapter for Prismatic GraphQL API for AI agent use.
    tools:
    - name: executegraphqlquery
      description: Prismatic Execute GraphQL Query or Mutation
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: prismatic.executegraphqlquery
      outputParameters:
      - type: object
        mapping: $.
    - name: refreshauthtoken
      description: Prismatic Refresh Authentication Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: prismatic.refreshauthtoken
      outputParameters:
      - type: object
        mapping: $.
    - name: revokeauthtoken
      description: Prismatic Revoke Refresh Token
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: prismatic.revokeauthtoken
      outputParameters:
      - type: object
        mapping: $.
    - name: getauthtoken
      description: Prismatic Get Short-Lived Auth Token
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: prismatic.getauthtoken
      outputParameters:
      - type: object
        mapping: $.
binds:
- namespace: env
  keys:
    PRISMATIC_TOKEN: PRISMATIC_TOKEN
